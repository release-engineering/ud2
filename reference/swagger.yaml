definitions:
  controllers.FilePaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  controllers.ProductPaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ProductResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  controllers.ProductVersionPaginatedResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ProductVersionResponse'
        type: array
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
      total_pages:
        example: 10
        type: integer
    type: object
  models.FileInput:
    properties:
      classifier:
        items:
          type: string
        type: array
      content_types:
        items:
          type: string
        type: array
      description:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      installation:
        type: string
      issues:
        items:
          $ref: '#/definitions/models.FileIssue'
        type: array
      long_description:
        type: string
      md5:
        type: string
      sha256:
        type: string
      visibility:
        example: visible
        type: string
    required:
    - description
    - file_name
    - file_size
    - sha256
    type: object
  models.FileIssue:
    properties:
      id:
        example: TUSC-1234
        type: string
      type:
        example: jira
        type: string
    type: object
  models.FileResponse:
    properties:
      classifier:
        items:
          type: string
        type: array
      content_types:
        items:
          type: string
        type: array
      description:
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: integer
      installation:
        type: string
      issues:
        items:
          $ref: '#/definitions/models.FileIssue'
        type: array
      long_description:
        type: string
      md5:
        type: string
      product_name:
        type: string
      product_version:
        type: string
      publish_date:
        type: string
      sha256:
        type: string
      update_date:
        type: string
      visibility:
        example: visible
        type: string
    type: object
  models.ProductInput:
    properties:
      arch:
        example: x86_64
        type: string
      category:
        example: Operating System
        type: string
      eng_id:
        example: 123
        type: integer
      name:
        example: Red Hat Enterprise Linux
        type: string
      product_code:
        example: RHEL-8
        type: string
      product_group:
        example: RHEL
        type: string
      product_group_name:
        example: Red Hat Enterprise Linux
        type: string
    required:
    - eng_id
    - name
    type: object
  models.ProductResponse:
    properties:
      arch:
        example: x86_64
        type: string
      category:
        example: Operating System
        type: string
      eng_id:
        example: 123
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: Red Hat Enterprise Linux
        type: string
      product_code:
        example: RHEL-8
        type: string
      product_group:
        example: RHEL
        type: string
      product_group_name:
        example: Red Hat Enterprise Linux
        type: string
    type: object
  models.ProductVersionInput:
    properties:
      architecture:
        example: x86_64
        type: string
      cpe:
        example: cpe:/o:redhat:enterprise_linux:8.5
        type: string
      platform:
        example: linux
        type: string
      sort_version:
        example: "1.0"
        type: string
      version:
        example: "8.5"
        type: string
      visibility:
        example: visible
        type: string
    required:
    - version
    type: object
  models.ProductVersionResponse:
    properties:
      architecture:
        example: x86_64
        type: string
      cpe:
        example: cpe:/o:redhat:enterprise_linux:8.5
        type: string
      id:
        example: 1
        type: integer
      platform:
        example: linux
        type: string
      product_id:
        example: 1
        type: integer
      sort_version:
        example: "1.0"
        type: string
      version:
        example: "8.5"
        type: string
      visibility:
        example: visible
        type: string
    type: object
info:
  contact: {}
  description: 'Requires client certificate. Use curl: --cert $MYCERT --key $MYKEY'
  title: Unified Downloads API
paths:
  /files/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a file by ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted file
        "400":
          description: Invalid file ID
        "404":
          description: File not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Delete a file
      tags:
      - files
    get:
      consumes:
      - application/json
      description: Retrieve a specific file by its ID
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved file
          schema:
            $ref: '#/definitions/models.FileResponse'
        "400":
          description: Invalid file ID
        "404":
          description: File not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Get a file by ID
      tags:
      - files
    put:
      consumes:
      - application/json
      description: Update an existing file with new details
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated file data
        in: body
        name: file
        required: true
        schema:
          $ref: '#/definitions/models.FileInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated file
          schema:
            $ref: '#/definitions/models.FileResponse'
        "400":
          description: Invalid input data or file ID
        "404":
          description: File not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Update a file
      tags:
      - files
  /files/search:
    get:
      consumes:
      - application/json
      description: Search files by various metadata with pagination. At least one
        search parameter must be provided.
      parameters:
      - description: Product ID (exact match)
        in: query
        name: product_id
        type: integer
      - description: Product Version ID (exact match)
        in: query
        name: version_id
        type: integer
      - description: Description (glob pattern, case-insensitive)
        in: query
        name: description
        type: string
      - description: File name (glob pattern, case-insensitive)
        in: query
        name: file_name
        type: string
      - description: Jira issue ID (e.g. TUSC-1234)
        in: query
        name: jira
        type: string
      - description: Content type (array inclusion check)
        in: query
        name: content_type
        type: string
      - description: JBoss ID (exact match)
        in: query
        name: jboss_id
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved files
          schema:
            $ref: '#/definitions/controllers.FilePaginatedResponse'
        "400":
          description: Invalid query parameters or no search parameters provided
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Search files
      tags:
      - files
  /product_versions/{product_version_id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a product version by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product Version ID
        in: path
        name: version_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted product version
        "400":
          description: Invalid product ID or version ID
        "404":
          description: Product or product version not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Delete a product version
      tags:
      - product-versions
    get:
      consumes:
      - application/json
      description: Retrieve a specific product version by its ID
      parameters:
      - description: Product Version ID
        in: path
        name: version_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved product version
          schema:
            $ref: '#/definitions/models.ProductVersionResponse'
        "400":
          description: Invalid product ID or version ID
        "404":
          description: Product or product version not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Get a product version by ID
      tags:
      - product-versions
    put:
      consumes:
      - application/json
      description: Update an existing product version with new details
      parameters:
      - description: Product Version ID
        in: path
        name: version_id
        required: true
        type: integer
      - description: Updated product version data
        in: body
        name: productVersion
        required: true
        schema:
          $ref: '#/definitions/models.ProductVersionInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated product version
          schema:
            $ref: '#/definitions/models.ProductVersionResponse'
        "400":
          description: Invalid input data, or product version ID
        "404":
          description: product version not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Update a product version
      tags:
      - product-versions
  /product_versions/{product_version_id}/files:
    get:
      consumes:
      - application/json
      description: Get a paginated list of files for a specific product version
      parameters:
      - description: Product Version ID
        in: path
        name: product_version_id
        required: true
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Sort order: asc or desc (default: asc)'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved files
          schema:
            $ref: '#/definitions/controllers.FilePaginatedResponse'
        "400":
          description: Invalid query parameters or product version ID
        "404":
          description: Product version not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: List files
      tags:
      - files
    post:
      consumes:
      - application/json
      description: Create a new file for a specific product version
      parameters:
      - description: Product Version ID
        in: path
        name: product_version_id
        required: true
        type: integer
      - description: File data
        in: body
        name: file
        required: true
        schema:
          $ref: '#/definitions/models.FileInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created file
          schema:
            $ref: '#/definitions/models.FileResponse'
        "400":
          description: Invalid input data or product version ID
        "404":
          description: Product version not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Create a file
      tags:
      - files
  /product_versions/search:
    get:
      consumes:
      - application/json
      description: Search product versions by version, CPE, and/or product ID with
        pagination. At least one search parameter must be provided and non-empty.
        Product ID must be greater than 0.
      parameters:
      - description: Product version (glob pattern, case-insensitive)
        in: query
        name: version
        type: string
      - description: Product ID (exact match, must be > 0)
        in: query
        name: product_id
        type: integer
      - description: CPE string (glob pattern, case-insensitive)
        in: query
        name: cpe
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved product versions
          schema:
            $ref: '#/definitions/controllers.ProductVersionPaginatedResponse'
        "400":
          description: Invalid query parameters or no search parameters provided
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Search product versions
      tags:
      - product-versions
  /products:
    get:
      consumes:
      - application/json
      description: Get a paginated list of products with optional sorting
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Sort order: asc or desc (default: asc)'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved products
          schema:
            $ref: '#/definitions/controllers.ProductPaginatedResponse'
        "400":
          description: Invalid query parameters
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with the provided details
      parameters:
      - description: Product data
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.ProductInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created product
          schema:
            $ref: '#/definitions/models.ProductResponse'
        "400":
          description: Invalid input data
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Create a new product
      tags:
      - products
  /products/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Successfully deleted product
        "400":
          description: Invalid product ID
        "404":
          description: Product not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      consumes:
      - application/json
      description: Retrieve a specific product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved product
          schema:
            $ref: '#/definitions/models.ProductResponse'
        "400":
          description: Invalid product ID
        "404":
          description: Product not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Get a product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update an existing product with new details
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated product data
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/models.ProductInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated product
          schema:
            $ref: '#/definitions/models.ProductResponse'
        "400":
          description: Invalid input data or product ID
        "404":
          description: Product not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Update a product
      tags:
      - products
  /products/{id}/product_versions:
    get:
      consumes:
      - application/json
      description: Get all versions for a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved product versions
          schema:
            items:
              $ref: '#/definitions/models.ProductVersionResponse'
            type: array
        "400":
          description: Invalid product ID
        "404":
          description: Product not found
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: List product versions
      tags:
      - product-versions
    post:
      consumes:
      - application/json
      description: Create a new version for a specific product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product version data
        in: body
        name: productVersion
        required: true
        schema:
          $ref: '#/definitions/models.ProductVersionInput'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created product version
          schema:
            $ref: '#/definitions/models.ProductVersionResponse'
        "400":
          description: Invalid input data or product ID
        "404":
          description: Product not found
        "409":
          description: Product version already exists
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Create a product version
      tags:
      - product-versions
  /products/search:
    get:
      consumes:
      - application/json
      description: Search products by name and/or engineering ID with pagination.
        At least one search parameter must be provided and non-empty. Engineering
        ID must be greater than 0.
      parameters:
      - description: Product name (partial, case-insensitive)
        in: query
        name: name
        type: string
      - description: Engineering ID (exact match, must be > 0)
        in: query
        name: eng_id
        type: integer
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved products
          schema:
            $ref: '#/definitions/controllers.ProductPaginatedResponse'
        "400":
          description: Invalid query parameters or no search parameters provided
        "500":
          description: Internal server error
      security:
      - CertAuth: []
      summary: Search products
      tags:
      - products
securityDefinitions:
  CertAuth:
    type: basic
swagger: "2.0"
